pre-commit:
  parallel: true
  commands:
    backend-lint:
      root: "backend/"
      glob: "*.ts"
      run: npm run lint
    backend-typecheck:
      root: "backend/"
      glob: "*.ts"
      run: npm run typecheck
    frontend-lint:
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: npm run lint
    frontend-typecheck:
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: npm run typecheck
