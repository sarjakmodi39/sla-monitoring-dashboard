AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SLA Monitoring Dashboard backend

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        DATABASE_URL: !Ref DatabaseUrl

Resources:
  Api:
    Type: AWS::Serverless::HttpApi

  UploadHandler:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/upload-handler/index.ts
        Minify: false
        Target: node20
    Properties:
      Handler: src/upload-handler/index.handler
      Events:
        Upload:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /upload
            Method: post

  QueryHandler:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/query-handler/index.ts
        Minify: false
        Target: node20
    Properties:
      Handler: src/query-handler/index.handler
      Events:
        Stats:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /stats
            Method: get
        Logs:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /logs
            Method: get

Outputs:
  ApiUrl:
    Description: Base URL for the HTTP API
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
